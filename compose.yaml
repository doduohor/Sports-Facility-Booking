services:
  api:
    build:
      context: .
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: "jdbc:postgresql://postgres:5432/sports_facility_booking"
      DATABASE_USER: "sports"
      DATABASE_PASSWORD: "sports"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: "sports_facility_booking"
      POSTGRES_USER: "sports"
      POSTGRES_PASSWORD: "sports"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d sports_facility_booking"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
