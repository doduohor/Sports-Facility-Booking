name: Docker smoke test

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Docker smoke test
        run: bash scripts/docker-smoke.sh

      - name: Repeat Docker smoke test
        run: bash scripts/docker-smoke.sh
